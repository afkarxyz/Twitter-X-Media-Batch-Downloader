name: Build Multi-Platform

# Runs only when started from the Actions tab (Run workflow), never on a push.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to publish, such as v6.0.0. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins the Windows MSVC host for local development;
  # every runner builds with the stable toolchain for its own host instead.
  RUSTUP_TOOLCHAIN: stable
  BIN: TwitterXMediaBatchDownloader
  # Matches the app ID used for the Wayland window and the desktop entry.
  APP_ID: twitterxmediabatchdownloader

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Signed build provenance: gh attestation verify <file> --repo <owner/repo>
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            asset: TwitterXMediaBatchDownloader.exe
          # Ubuntu 22.04 keeps the glibc requirement at 2.35 for older distributions.
          - name: linux-x64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            asset: TwitterXMediaBatchDownloader.AppImage
            appimage_arch: x86_64
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          - name: linux-arm64
            os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
            asset: TwitterXMediaBatchDownloader-ARM.AppImage
            appimage_arch: aarch64
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
          - name: macos-universal
            os: macos-14
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            asset: TwitterXMediaBatchDownloader.dmg
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Read version
        shell: bash
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"

      - name: Build
        if: runner.os != 'macOS'
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.targets }}

      - name: Build universal binary
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output "target/universal/$BIN" \
            "target/aarch64-apple-darwin/release/$BIN" \
            "target/x86_64-apple-darwin/release/$BIN"
          lipo -info "target/universal/$BIN"

      # Release assets are single files. The app keeps its .twitterxmediabatchdownloader
      # data and Downloads folder beside the .exe, the .AppImage file or the .app bundle.
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          cp "target/${{ matrix.targets }}/release/$BIN.exe" "out/${{ matrix.asset }}"

      - name: Package AppImage
        if: runner.os == 'Linux'
        env:
          # Run appimagetool without FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          tool="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$tool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.appimage_arch }}.AppImage"
          echo "${{ matrix.appimagetool_sha256 }}  $tool" | sha256sum -c -
          chmod +x "$tool"

          # The binary links only against glibc; display and GPU libraries load at runtime.
          appdir="$RUNNER_TEMP/AppDir"
          mkdir -p "$appdir/usr/bin"
          install -m 755 "target/${{ matrix.targets }}/release/$BIN" "$appdir/usr/bin/$BIN"
          ln -s "usr/bin/$BIN" "$appdir/AppRun"
          install -m 644 assets/logo/logo.png "$appdir/$APP_ID.png"
          ln -s "$APP_ID.png" "$appdir/.DirIcon"
          cat > "$appdir/$APP_ID.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Twitter/X Media Batch Downloader
          Comment=Downloads original-quality images and videos from Twitter/X accounts.
          Exec=$BIN
          Icon=$APP_ID
          StartupWMClass=$APP_ID
          Categories=Network;
          Terminal=false
          EOF

          mkdir -p out
          ARCH=${{ matrix.appimage_arch }} VERSION="$VERSION" "$tool" "$appdir" "out/${{ matrix.asset }}"

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          staging="$RUNNER_TEMP/dmg"
          app="$staging/$BIN.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          install -m 755 "target/universal/$BIN" "$app/Contents/MacOS/$BIN"

          iconset="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/logo/logo.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) assets/logo/logo.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>$BIN</string>
            <key>CFBundleDisplayName</key><string>Twitter/X Media Batch Downloader</string>
            <key>CFBundleIdentifier</key><string>app.twitterdl.$APP_ID</string>
            <key>CFBundleExecutable</key><string>$BIN</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"

          # Ad-hoc signature: Apple Silicon refuses to run unsigned code.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

          # In Applications the app uses Application Support and ~/Downloads;
          # anywhere else it stays portable beside the .app.
          ln -s /Applications "$staging/Applications"
          mkdir -p out
          hdiutil create -volname "$BIN" -srcfolder "$staging" -fs HFS+ -format UDZO -ov "out/${{ matrix.asset }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/${{ matrix.asset }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: inputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release }}
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v6.0.0, got: $TAG" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      # The tag is created on the commit that was built when it does not exist yet.
      # GitHub lists a SHA-256 digest for every release asset.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          ls -la
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
